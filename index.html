<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JASTIP KAI EXPO 2026 BY ALIN</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 650px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .header h1 { font-size: 1.4rem; color: #00529c; text-transform: uppercase; font-weight: 800; }
        .header p { color: #666; font-size: 0.9rem; margin-top: 5px; }
        .section-title { font-weight: bold; font-size: 1.05rem; color: #00529c; margin: 20px 0 10px; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.88rem; }
        input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #00529c; }
        .passenger-box { background: #f9f9f9; padding: 12px; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 12px; }
        .passenger-box h4 { font-size: 0.9rem; margin-bottom: 8px; color: #444; }
        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }
        button { width: 100%; background-color: #25D366; color: white; border: none; padding: 14px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; transition: background 0.3s; }
        button:hover { background-color: #1eb854; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>JASTIP KAI EXPO 2026 BY ALIN</h1>
        <p>X: @alineyzd</p>
    </div>

    <form id="bookingForm">
        <div class="section-title">1. Kontak Pemesan Utama</div>
        <div class="form-group">
            <label for="namaPemesan">Nama Pemesan Utama:</label>
            <input type="text" id="namaPemesan" placeholder="Contoh: Alin" required>
        </div>
        <div class="row">
            <div class="form-group">
                <label for="hp">No. WhatsApp (Aktif):</label>
                <input type="tel" id="hp" placeholder="Contoh: 08123456789" required>
            </div>
            <div class="form-group">
                <label for="email">Alamat Email:</label>
                <input type="email" id="email" placeholder="contoh@gmail.com" required>
            </div>
        </div>

        <div class="section-title">2. Detail Perjalanan</div>
        <div class="form-group">
            <label for="jenisTipe">Tipe Perjalanan:</label>
            <select id="jenisTipe" onchange="togglePP()">
                <option value="One Way">One Way (Sekali Jalan)</option>
                <option value="Pulang Pergi (PP)">Pulang Pergi (PP)</option>
            </select>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="stasiunAsal">Stasiun Asal:</label>
                <input type="text" id="stasiunAsal" placeholder="Contoh: Gambir" required>
            </div>
            <div class="form-group">
                <label for="stasiunTujuan">Stasiun Akhir / Tujuan:</label>
                <input type="text" id="stasiunTujuan" placeholder="Contoh: Surabaya Pasarturi" required>
            </div>
        </div>

        <!-- Kereta Pergi -->
        <div class="form-group">
            <label for="keretaPergi">Nama Kereta & Kelas (Pergi):</label>
            <input type="text" id="keretaPergi" placeholder="Contoh: Argo Bromo Anggrek (Eksekutif)" required>
        </div>
        <div class="row">
            <div class="form-group">
                <label for="tglPergi">Tanggal Keberangkatan:</label>
                <input type="date" id="tglPergi" required>
            </div>
            <div class="form-group">
                <label for="jamPergi">Jam Keberangkatan (Pergi):</label>
                <input type="text" id="jamPergi" placeholder="Contoh: 08:20 / Pagi" required>
            </div>
        </div>

        <!-- Kereta Pulang (Opsional PP) -->
        <div id="sectionPulang" style="display: none;">
            <hr style="margin: 15px 0; border: none; border-top: 1px dashed #ccc;">
            <div class="form-group">
                <label for="keretaPulang">Nama Kereta & Kelas (Pulang):</label>
                <input type="text" id="keretaPulang" placeholder="Contoh: Sembrani (Eksekutif)">
            </div>
            <div class="row">
                <div class="form-group">
                    <label for="tglPulang">Tanggal Kepulangan:</label>
                    <input type="date" id="tglPulang">
                </div>
                <div class="form-group">
                    <label for="jamPulang">Jam Keberangkatan (Pulang):</label>
                    <input type="text" id="jamPulang" placeholder="Contoh: 19:30 / Malam">
                </div>
            </div>
        </div>

        <div class="form-group" style="margin-top: 15px;">
            <label for="requestSeat">Request Posisi Kursi (Pilih Salah Satu):</label>
            <select id="requestSeat">
                <option value="Bebas / Random">Bebas / Bebas Mana Saja</option>
                <option value="Kursi A (Samping Jendela)">Kursi A (Samping Jendela)</option>
                <option value="Kursi B (Samping Lorong / Tengah)">Kursi B</option>
                <option value="Kursi C (Samping Lorong / Tengah)">Kursi C</option>
                <option value="Kursi D (Samping Jendela)">Kursi D (Samping Jendela)</option>
            </select>
            <small style="color: #777; font-size: 0.75rem;">*Nomor baris kursi tidak bisa diminta (ditentukan oleh sistem KAI/Expo).</small>
        </div>

        <div class="section-title">3. Data Penumpang (Maksimal 4 NIK)</div>
        
        <!-- Penumpang 1 -->
        <div class="passenger-box">
            <h4>Penumpang 1 (Wajib)</h4>
            <div class="row">
                <div class="form-group" style="margin-bottom:0;">
                    <input type="text" id="nama1" placeholder="Nama Sesuai KTP" required>
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <input type="number" id="nik1" placeholder="NIK / No. KTP" required>
                </div>
            </div>
        </div>

        <!-- Penumpang 2 -->
        <div class="passenger-box">
            <h4>Penumpang 2 (Opsional)</h4>
            <div class="row">
                <div class="form-group" style="margin-bottom:0;">
                    <input type="text" id="nama2" placeholder="Nama Sesuai KTP">
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <input type="number" id="nik2" placeholder="NIK / No. KTP">
                </div>
            </div>
        </div>

        <!-- Penumpang 3 -->
        <div class="passenger-box">
            <h4>Penumpang 3 (Opsional)</h4>
            <div class="row">
                <div class="form-group" style="margin-bottom:0;">
                    <input type="text" id="nama3" placeholder="Nama Sesuai KTP">
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <input type="number" id="nik3" placeholder="NIK / No. KTP">
                </div>
            </div>
        </div>

        <!-- Penumpang 4 -->
        <div class="passenger-box">
            <h4>Penumpang 4 (Opsional)</h4>
            <div class="row">
                <div class="form-group" style="margin-bottom:0;">
                    <input type="text" id="nama4" placeholder="Nama Sesuai KTP">
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <input type="number" id="nik4" placeholder="NIK / No. KTP">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="catatan">Catatan / Opsi Kereta Cadangan:</label>
            <textarea id="catatan" rows="3" placeholder="Contoh: Jika jam pagi habis, boleh diganti ke jam sore."></textarea>
        </div>

        <button type="button" onclick="sendToWhatsapp()">Kirim Form via WhatsApp</button>
    </form>
</div>

<script>
    function togglePP() {
        const tipe = document.getElementById('jenisTipe').value;
        const secPulang = document.getElementById('sectionPulang');
        if (tipe === 'Pulang Pergi (PP)') {
            secPulang.style.display = 'block';
        } else {
            secPulang.style.display = 'none';
        }
    }

    function sendToWhatsapp() {
        const adminWa = "6285134519443";
        
        const namaPemesan = document.getElementById('namaPemesan').value.trim();
        const hp = document.getElementById('hp').value.trim();
        const email = document.getElementById('email').value.trim();
        const tipe = document.getElementById('jenisTipe').value;
        
        const stasiunAsal = document.getElementById('stasiunAsal').value.trim();
        const stasiunTujuan = document.getElementById('stasiunTujuan').value.trim();
        
        const keretaPergi = document.getElementById('keretaPergi').value.trim();
        const tglPergi = document.getElementById('tglPergi').value.trim();
        const jamPergi = document.getElementById('jamPergi').value.trim();
        
        const keretaPulang = document.getElementById('keretaPulang').value.trim();
        const tglPulang = document.getElementById('tglPulang').value.trim();
        const jamPulang = document.getElementById('jamPulang').value.trim();
        
        const requestSeat = document.getElementById('requestSeat').value;
        const catatan = document.getElementById('catatan').value.trim();

        if (!namaPemesan || !hp || !email || !stasiunAsal || !stasiunTujuan || !keretaPergi || !tglPergi || !jamPergi) {
            alert('Mohon lengkapi data pemesan, rute stasiun, serta detail keberangkatan!');
            return;
        }

        // Kumpul data penumpang
        let dataPenumpang = '';
        for (let i = 1; i <= 4; i++) {
            const nama = document.getElementById(`nama${i}`).value.trim();
            const nik = document.getElementById(`nik${i}`).value.trim();
            if (nama && nik) {
                dataPenumpang += `- Penumpang ${i}: ${nama} (${nik})%0A`;
            }
        }

        if (dataPenumpang === '') {
            alert('Mohon isi minimal Data Penumpang 1!');
            return;
        }

        let pesanPerjalanan = `*Tipe Perjalanan:* ${tipe}%0A` +
            `*Rute:* ${stasiunAsal} ➡️ ${stasiunTujuan}%0A%0A` +
            `*Detail Pergi:*%0A` +
            `- Kereta: ${keretaPergi}%0A` +
            `- Tanggal: ${tglPergi}%0A` +
            `- Jam: ${jamPergi}%0A`;

        if (tipe === 'Pulang Pergi (PP)') {
            pesanPerjalanan += `%0A*Detail Pulang:*%0A` +
                `- Kereta: ${keretaPulang || '-'}%0A` +
                `- Tanggal: ${tglPulang || '-'}%0A` +
                `- Jam: ${jamPulang || '-'}%0A`;
        }

        const message = `Halo Kak Alin (@alineyzd), saya mau order jastip tiket KAI Expo 2026.%0A%0A` +
            `*Detail Pemesan:*%0A` +
            `- Nama: ${namaPemesan}%0A` +
            `- No WA: ${hp}%0A` +
            `- Email: ${email}%0A%0A` +
            pesanPerjalanan + `%0A` +
            `*Request Posisi Kursi:* ${requestSeat}%0A%0A` +
            `*Data Penumpang:*%0A${dataPenumpang}%0A` +
            `*Catatan Cadangan:* ${catatan || '-'}`;

        const whatsappUrl = `https://wa.me/${adminWa}?text=${message}`;
        window.open(whatsappUrl, '_blank');
    }
</script>

</body>
</html>
